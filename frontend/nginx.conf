# The whole nginx.conf, replacing the image's default rather than dropping a
# server block into conf.d/. Two things make that the right shape here: the
# process has to run unprivileged, which is a main-context concern the default
# file decides, and a reader looking for "where does /api/ go?" should find one
# file with the answer rather than two that have to be read together.
#
# Running as the `nginx` account is what every directive below the log lines is
# for. A stock configuration writes its pid to /var/run and its temp files under
# /var/cache/nginx, both of which a non-root master cannot create. There is
# deliberately NO `user` directive: nginx only honours it when the master is
# root, and warns about it otherwise - the Dockerfile's `USER nginx` is what
# sets the account.

worker_processes auto;

error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # To the container's stdout, so `docker compose logs ui` is the whole story
    # and nothing accumulates inside the image.
    access_log /dev/stdout;

    # All five, not only the two that are obvious. A missing one is not a
    # warning at start-up: it is a 500 on the first request that happens to
    # need that buffer, which is the kind of defect that ships.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    server {
        # An unprivileged port, and that is the reason `USER nginx` works with
        # no CAP_NET_BIND_SERVICE and no setcap in the image. Compose publishes
        # it as 8080 on the host too, so the number in the README is the number
        # in this file.
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # 08-REVIEW WR-03. Three headers, and one nginx rule that decides where
        # they have to be written.
        #
        # `add_header` is NOT additive across levels. A directive at THIS level
        # is inherited by a location only while that location declares no
        # `add_header` of its own; the moment it declares one, the whole set
        # from here is replaced rather than extended. Two locations below set a
        # Cache-Control, so each of them repeats all three. That repetition is
        # the point, not an oversight - a "tidy up" that deletes it silently
        # unprotects the entry document and every fingerprinted asset while
        # leaving this block looking correct. The curl proofs in the WR-03
        # commit cover all four served shapes for exactly that reason.
        #
        # `always` on each, so they are sent on a 4xx and a 5xx too. Without it
        # nginx attaches them only to 200/201/204/301/302/304, which would mean
        # the proxied 401 an unauthenticated SPA call gets back - the single
        # most common response this origin serves - carried none of them.
        #
        # What each one is for. `nosniff` stops a browser from content-type
        # guessing its way into treating a served file as a script. The other
        # two are the same defence stated twice for coverage rather than
        # belt-and-braces: `frame-ancestors 'none'` is the CSP-era directive
        # and `X-Frame-Options: DENY` is what a browser that ignores it still
        # honours. This UI holds a bearer token in memory and puts one-click
        # Delete buttons behind nothing but `window.confirm`, so being framable
        # is a clickjacking surface. No other CSP directive is set: a policy
        # that also constrained script-src would have to be verified against
        # Vite's output on every build, and an untested CSP is a blank page.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        # The whole of D-03 / ADR-107, in six lines. The browser makes every
        # call to /api/v1/... on its OWN origin; this block forwards it to the
        # api service over the compose network. There is no cross origin, so
        # there is no Access-Control-Allow-* header anywhere in this project and
        # src/taskmanager never learns it has a browser client.
        #
        # NO trailing slash on the upstream. `proxy_pass http://api:8000;`
        # forwards the full original URI including the /api/ prefix, which is
        # what the API actually serves; `http://api:8000/` would strip the
        # matched prefix and turn /api/v1/task-lists into /v1/task-lists.
        #
        # The accepted cost, stated because it is real: nginx resolves a literal
        # upstream hostname ONCE, at start-up, and caches the address. Recreating
        # the api container therefore needs this one restarted. The
        # `depends_on: condition: service_healthy` in docker-compose.yml is what
        # guarantees the name resolves at start-up in the first place.
        location /api/ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # Deliberately NOT proxied: /docs, /redoc, /openapi.json and /health.
        # They stay on http://localhost:8000, which is where the README already
        # sends the evaluator. A second URL for the same Swagger page is a second
        # thing that has to keep being true, and it would make the two documents
        # disagree about where the API lives (ADR-107).

        # The entry document is the one file that must never be cached: Vite
        # fingerprints every asset filename, so a stale index.html is a page
        # asking for chunks that no longer exist.
        #
        # This block serves more than a literal request for /index.html: the
        # SPA fallback's `try_files ... /index.html` is an internal redirect,
        # which re-runs location matching, so every deep path lands here too.
        # That is what makes the three repeated headers below load-bearing
        # rather than defensive.
        location = /index.html {
            add_header Cache-Control "no-store";
            # Repeated because this location declares an `add_header` at all -
            # see the server block. Not inherited, not optional.
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }

        # Fingerprinted, therefore immutable: a changed asset is a changed name.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            # Repeated for the same reason, and it matters here too: these are
            # the files a sniffing browser would be guessing about.
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }

        # The SPA fallback. It CANNOT swallow /api/, and the reason is worth
        # spelling out because the failure it would cause is so quiet: nginx
        # selects the LONGEST matching prefix location, so /api/v1/task-lists is
        # served by the block above and never reaches this one. Without that
        # rule an unauthenticated API call would come back as 200 text/html -
        # the index page - and the client would report a parse error instead of
        # the 401 the API actually sent.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
