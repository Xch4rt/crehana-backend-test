# The runnable stack. One command: `docker compose up`.
#
# No top-level `version:` key. It has been obsolete since Compose v2 and only
# earns a deprecation warning on every single invocation.
#
# Three services, two of which are long-running (D-14): `db` and `api` are what
# `docker compose up` starts, and `test` is built from the Dockerfile's test
# stage to be *invoked* rather than started.
#
# Configuration enters through `env_file: .env`, so the evaluator's setup is
# `cp .env.example .env` once (D-15). No secret has a default anywhere in this
# project, and this file adds none.

services:
  db:
    # Pinned to the major version (ADR-013). `postgres:latest` would make the
    # stack a different database from one clone to the next.
    image: postgres:18-alpine
    # Deliberately fake local-evaluation credentials, identical to the ones
    # .github/workflows/ci.yml uses for its service container. No repository
    # secret and no real credential appears anywhere in this file.
    environment:
      POSTGRES_USER: taskmanager
      POSTGRES_PASSWORD: taskmanager
      POSTGRES_DB: taskmanager
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data. PostgreSQL 18 images
      # store the cluster in a major-version-specific subdirectory
      # (PGDATA=/var/lib/postgresql/18/docker) so that `pg_upgrade --link` can
      # work across a single mount point. A volume mounted at the old
      # .../data path makes the entrypoint refuse to start, with a message
      # about "PostgreSQL data in /var/lib/postgresql/data (unused
      # mount/volume)" - observed on postgres:18-alpine while writing this file.
      - pgdata:/var/lib/postgresql
      # Read-only: the entrypoint executes these files as the database
      # superuser, so the container has no business being able to rewrite them.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Published on purpose (D-15): host-side `make test` runs against this
      # very container, so the integration suite and `docker compose up` share
      # one database instead of drifting into two.
      - "5432:5432"
    healthcheck:
      # `-h 127.0.0.1` is load-bearing: the official image's init-time server
      # listens only on a Unix socket, so a health command without it reports
      # ready too early - and `depends_on: condition: service_healthy` would
      # then start the API against a server with no TCP listener. Identical
      # reasoning, and identical flags, to .github/workflows/ci.yml.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      target: runtime
    # `env_file` entries are required by default, so a missing .env stops compose
    # with an error naming this file instead of starting the API on defaults it
    # does not have. That failure is the intended D-15 behaviour, not a rough
    # edge: `cp .env.example .env` is step one of the README, and an application
    # silently running on half a configuration is the outcome worth preventing.
    env_file: .env
    environment:
      # `environment` takes precedence over `env_file` (verified against the
      # Compose specification). That ordering is what lets a developer's .env keep
      # `localhost` for `make test`, `make run` and host-side alembic while the
      # container - which has no localhost database - talks to the `db` service
      # over the compose network. Nobody has to edit .env between the two paths.
      DATABASE_URL: postgresql+psycopg://taskmanager:taskmanager@db:5432/taskmanager
    depends_on:
      db:
        # Half of the D-07 belt and braces. The other half is the bounded retry
        # loop in docker/entrypoint.sh, which is what keeps the image correct
        # under a plain `docker run` and after a database restart - neither of
        # which this condition covers.
        condition: service_healthy
    ports:
      - "8000:8000"
    # No `healthcheck:` block here, and that omission is deliberate rather than
    # forgotten: Compose inherits the image's HEALTHCHECK unless the service
    # overrides it, and the Dockerfile already declares one against /health
    # (D-09). Repeating it here would create a second copy to keep in sync.
    #
    # No bind mount of src/, no auto-restart-on-edit watcher and no `user:`
    # override either (D-16): `docker compose up` runs the production-like image,
    # non-root, with the real entrypoint. The host-side fast loop is `make run`,
    # which is why no docker-compose.override.yml ships with this repository.
    # Those two flag names are described rather than spelled here on purpose, so
    # that grepping this file for either of them stays a meaningful gate.

  test:
    build:
      context: .
      target: test
    env_file: .env
    environment:
      # Both variables, and both pointing at taskmanager_test. DATABASE_URL is
      # what Settings reads at import; TEST_DATABASE_URL is what the integration
      # fixtures read. Setting only one would leave the other resolving to the
      # application database, and the schema fixture runs `downgrade base`.
      DATABASE_URL: postgresql+psycopg://taskmanager:taskmanager@db:5432/taskmanager_test
      TEST_DATABASE_URL: postgresql+psycopg://taskmanager:taskmanager@db:5432/taskmanager_test
    depends_on:
      db:
        condition: service_healthy
    # This service is invoked, never started: `docker compose run --rm --build
    # test`, which is exactly what `make docker-test` runs (D-14). Consequences,
    # all intentional:
    #   * no published ports - it serves nothing;
    #   * no entrypoint override - the test stage's own `CMD ["pytest"]` is the
    #     command, and the stage deliberately does not carry
    #     docker/entrypoint.sh, because the pytest fixture owns the test schema
    #     and must not race an `alembic upgrade head` run beside it (D-06);
    #   * no compose profile - `docker compose run test` names the service
    #     explicitly, so a profile would only add a flag the README must explain.

volumes:
  pgdata:
