[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmanager"
version = "0.1.0"
description = "Task Manager API - Crehana Backend Technical Challenge"
requires-python = ">=3.13"
# NOTE: no [project.dependencies] on purpose. requirements.txt and
# requirements-dev.txt are the single source of truth for versions; a second
# list here would silently drift out of sync with the pinned files.

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["taskmanager"]

[tool.mypy]
python_version = "3.13"
strict = true
# The pydantic plugin is mandatory: without it a correct pydantic-settings
# module produces spurious `call-arg` errors under strict mode.
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = "src"
packages = ["taskmanager"]

[tool.coverage.run]
source = ["taskmanager"]
branch = true
# Not decoration, and not a performance knob. SQLAlchemy's async engine reaches
# the driver through a greenlet, so every line of a router handler that runs
# *after* its first `await` into the database executes in a frame coverage stops
# following unless greenlet is declared here. Without this line, Python 3.13
# reported 18 such lines missing - every `return XResponse.from_result(...)` and
# every `Location` header in `presentation/api/routers/` - while the tests that
# assert those very response bodies passed. That is a false negative, and it is
# the one kind of coverage error that cannot be argued away: the number was too
# LOW, so nobody would have gone looking. Measured and closed in plan 06-04,
# which is when `make docker-test` was first run against a suite with routers in
# it. See DECISION_LOG.md ADR-089.
concurrency = ["thread", "greenlet"]

# No `omit` entries and no `fail_under` here: the threshold lives in the
# pytest.ini addopts so every invocation is gated identically.
[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]
