[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "taskmanager"
version = "0.1.0"
description = "Task Manager API - Crehana Backend Technical Challenge"
requires-python = ">=3.13"
# NOTE: no [project.dependencies] on purpose. requirements.txt and
# requirements-dev.txt are the single source of truth for versions; a second
# list here would silently drift out of sync with the pinned files.

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["taskmanager"]

[tool.mypy]
python_version = "3.13"
strict = true
# The pydantic plugin is mandatory: without it a correct pydantic-settings
# module produces spurious `call-arg` errors under strict mode.
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = "src"
packages = ["taskmanager"]

[tool.coverage.run]
source = ["taskmanager"]
branch = true

# No `omit` entries and no `fail_under` here: the threshold lives in the
# pytest.ini addopts so every invocation is gated identically.
[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]
