[pytest]
testpaths = tests
# Safety net so a bare `pytest` works on a fresh clone, before `pip install -e .`.
pythonpath = src
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=taskmanager
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=75
markers =
    unit: pure domain/application tests, no I/O
    integration: tests that touch PostgreSQL
filterwarnings =
    error
