[pytest]
testpaths = tests
# Safety net so a bare `pytest` works on a fresh clone, before `pip install -e .`.
pythonpath = src
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=taskmanager
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=75
markers =
    unit: pure domain/application tests, no I/O
    integration: tests that touch PostgreSQL
    no_reread(reason): D-07 - this test mutates through the API and no GET can observe it; the reason says why, and tests/architecture/test_assertion_quality.py keeps the exemption justified
filterwarnings =
    error
