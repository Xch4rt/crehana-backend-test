# Alembic configuration: where the revisions live, and nothing about how to reach
# the database.
#
# Generated from the 1.20 `generic` template and then trimmed. Three edits are
# deliberate and each one is load-bearing:
#
#   * the database URL key is GONE, not commented-out-with-a-placeholder. See the
#     note above [post_write_hooks].
#   * prepend_sys_path points at src/, because the package lives there.
#   * the logging sections below are kept verbatim: migrations/env.py feeds them
#     to fileConfig(), so deleting them would leave Alembic silent.

[alembic]
# Path to the migration scripts, relative to %(here)s (the directory holding this
# file). Named `migrations/` rather than `alembic/` because .flake8 already
# carries `extend-exclude = ...,migrations`; the two must stay in agreement.
script_location = %(here)s/migrations

# Revision file names: <revision>_<slug>.py. Stated explicitly rather than left to
# the default, so `0001_baseline.py` is obviously the shape this project intends
# and not an accident of the template version in use.
file_template = %%(rev)s_%%(slug)s

# Prepended to sys.path. `.` (the template default) is not enough on a fresh
# clone: `taskmanager` lives under src/, so `alembic upgrade head` would fail to
# import the models on any checkout without an editable install - including the
# Docker runtime image, which installs the package non-editable but runs from
# /app.
prepend_sys_path = src

# Required: without it Alembic 1.16+ emits a deprecation warning about how it
# splits path lists, and pytest.ini sets `filterwarnings = error`, which turns
# that warning into a failing test.
path_separator = os

# NOTE - there is deliberately no database URL key in this file.
#
# Two reasons. First, Config.set_main_option() writes through ConfigParser's
# BasicInterpolation, which raises ValueError on any `%` the URL contains - one
# percent-encoded character in a password is enough to break every migration.
# Second, a URL here is a live credential sitting in a config file that Alembic
# may print. migrations/env.py therefore reads the URL from
# `Config(attributes={"sqlalchemy_url": ...})` when a caller supplies one, and
# otherwise from the DATABASE_URL environment variable.


[post_write_hooks]
# Deliberately empty. black and isort already run over migrations/ through
# pre-commit, so a second, differently-configured formatter invoked from here
# could only disagree with them.


# Logging configuration, consumed by migrations/env.py's fileConfig() call.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
